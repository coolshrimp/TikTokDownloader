name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Restore and build MUST be separate MSBuild invocations: the restore
      # writes obj\*.nuget.g.props/.targets (which import Fody and define
      # NuGetPackageRoot), and a combined /t:Restore,Build evaluates the
      # project before those files exist - producing an exe with nothing
      # embedded that silently fails to launch.
      - name: Restore
        run: msbuild "TikTok Downloader.csproj" /t:Restore /p:Configuration=Release /v:m

      - name: Build Release
        run: msbuild "TikTok Downloader.csproj" /t:Build /p:Configuration=Release /v:m

      - name: Verify single-exe embedding
        shell: powershell
        run: |
          $bytes = [IO.File]::ReadAllBytes("bin\Release\TikTok Downloader.exe")
          $asm = [Reflection.Assembly]::Load($bytes)
          $names = $asm.GetManifestResourceNames()
          Write-Host "Embedded resources:`n$($names -join "`n")"
          if (-not ($names | Where-Object { $_ -like 'costura.*' })) { throw "Costura resources missing - Fody did not weave." }
          if ($names -notcontains 'WebView2Loader.x64.dll') { throw "Native WebView2Loader resource missing." }
          if ((Get-Item "bin\Release\TikTok Downloader.exe").Length -lt 700KB) { throw "Exe suspiciously small - dependencies not embedded." }

      - name: Stage artifact
        run: Copy-Item "bin\Release\TikTok Downloader.exe" "TikTok-Downloader-${{ github.ref_name }}.exe"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TikTok Downloader ${{ github.ref_name }}
          generate_release_notes: true
          files: TikTok-Downloader-*.exe
